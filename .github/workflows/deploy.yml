name: Deploy Wake Game

on:
  push:
    branches: [main]

jobs:
  deploy-workers:
    name: Deploy Workers (后端 API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 本项目用 schema.sql 而非 migrations 目录，故用 execute 建表
        run: npx wrangler d1 execute wake-game-db --remote --file=workers/db/schema.sql
      - name: Seed D1 data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute wake-game-db --remote --file=workers/db/seed.sql
      - name: Deploy Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  deploy-pages:
    name: Deploy Pages (前端)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 用 wrangler-action 部署 Pages（cloudflare/pages-action 仓库不存在，改用官方 wrangler-action）
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=wake-game --branch=main
